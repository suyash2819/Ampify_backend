name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest httpx ruff

      - run: ruff check .
      - run: pytest
        env:
          # dummy values so the app can import; tests must not hit real services
          DATABASE_URL: "postgresql://user:pass@localhost:26257/test"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-only-secret"
