name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest httpx ruff
      - name: Debug layout
        run: |
          ls -la
          find . -name "main.py" -not -path "./.venv/*"
      # - run: ruff check .
      - run: pytest
        env:
          # dummy values so the app can import; tests must not hit real services
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-only-secret"
